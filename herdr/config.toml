# herdr config. install.sh seeds this to ~/.config/herdr/config.toml only if none exists,
# because herdr writes that file itself (onboarding, `herdr config reset-keys`).
# Full reference: `herdr --default-config`. Apply edits with `herdr server reload-config`.
onboarding = false

[theme]
name = "catppuccin"

[keys]
# ctrl+b, not tmux's ctrl-a, so tmux and herdr never fight over the prefix.
prefix = "ctrl+b"

[ui.toast]
# macOS notifications; terminal-notifier (Brewfile) makes them show as herdr, not Script Editor.
delivery = "system"

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"
